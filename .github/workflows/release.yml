name: Release Nova Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v6.0.0)'
        required: true
        default: 'v6.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver -or $ver -eq "main" -or $ver -eq "master") {
            $ver = "${{ github.event.inputs.version }}"
          }
          if (-not $ver) { $ver = "v6.0.0" }
          
          New-Item -ItemType Directory -Path "dist" -Force
          $sourceExe = "target\release\my_rust_browser.exe"
          $portableExe = "dist\Nova-Studio-$ver-Portable.exe"
          Copy-Item $sourceExe $portableExe -Force
          
          # Compile 1-Click Setup Installer
          $setupExe = "dist\Nova-Studio-$ver-Setup.exe"
          rustc -O -C panic=abort -C lto=fat -C codegen-units=1 src/installer.rs -o $setupExe
          
          # Calculate SHA-256 Checksums
          $lines = @()
          foreach ($file in @($portableExe, $setupExe)) {
            $h = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
            $fname = Split-Path $file -Leaf
            $lines += "$h  $fname"
            Write-Host "✅ $fname SHA256: $h"
          }
          $lines | Out-File -FilePath "dist\checksums-sha256.txt" -Encoding ascii

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Nova-Studio-*.exe
            dist/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
