name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-check:
    name: Lint & Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all -- --check

  build-windows:
    name: Windows Check & Clippy
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure Target Exe Directory Placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "target\release" -Force
          Set-Content -Path "target\release\my_rust_browser.exe" -Value "NOVA_PLACEHOLDER"

      - name: Cargo Check
        run: cargo check --release --bin my_rust_browser --bin nova-installer

      - name: Cargo Clippy
        run: cargo clippy --release --bin my_rust_browser --bin nova-installer -- -D warnings

      - name: Cargo Build Binaries
        run: cargo build --release --locked --bins
